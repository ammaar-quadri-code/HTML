<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Page with CSS</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>
    <div class="parent" align="center">
        <h1>SD Hub Survey Form</h1>
        <p><i>Thank You for taking the time to help us improve the platform</i></p>
    </div>
    <div class="main">
        <form action="">
            
                <label for="name">Name</label>
                <input type="text" placeholder="Enter your name" name="name" id="name">

                <label for="email">Email</label>
                <input type="email" placeholder="Enter your Email" name="email" id="email">

                <label for="age">Age <span>(optional)</span></label>
                <input type="number" placeholder="Age" name="age" id="age">

                <label for="role">Which option best describes your current role ?</label>

                <select name="role" id="roleS">
                    <option value="">Select current role</option>
                    <option value="">Student</option>
                    <option value="">Full Time Job</option>
                    <option value="">Full Time Learner</option>
                    <option value="">Prefer not to say</option>
                    <option value="">Other</option>
                </select>

                <label for="">
                    Which option best describes your current role?
                </label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="recommend" value="definitely">
                        Definitely
                    </label>
                    <label>
                        <input type="radio" name="recommend" value="maybe">
                        Maybe
                    </label>
                    <label>
                        <input type="radio" name="recommend" value="not-sure">
                        Not Sure
                    </label>
                </div>

                <label for="feature">
                    What is your favorite feature of SD Hub?
                </label>

                <select id="feature" name="feature">
                    <option value="">Select an option</option>
                    <option value="projects">Projects</option>
                    <option value="challenges">Coding Challenges</option>
                    <option value="community">Community</option>
                    <option value="courses">Courses</option>
                    <option value="videos">Videos</option>
                </select>

                <label>
                    What would you like to be improved?
                    <span>(Check all that apply)</span>
                </label>

                <div class="checkbox-group">

                    <label>
                        <input type="checkbox" name="improvement" value="">
                        Front-end Projects
                    </label>
                    <label>
                        <input type="checkbox" name="improvement" value="">
                        Back-end Projects
                    </label>
                    <label>
                        <input type="checkbox" name="improvement" value="">
                        Communication Classes
                    </label>
                    <label>
                        <input type="checkbox" name="improvement" value="">
                        Telugu Classes
                    </label>
                    <label>
                        <input type="checkbox" name="improvement" value="">
                        Challenges
                    </label>
                    <label>
                        <input type="checkbox" name="improvement" value="">
                        Open Souce Community
                    </label>
                    <label>
                        <input type="checkbox" name="improvement" value="">
                        Additional Courses
                    </label>
                </div>

                <label for="comments">Any comments or suggestions?</label>

                <textarea name="" id="comments" placeholder="Enter your comment here..."></textarea>


            <button type="submit">Submit</button>

        </form>
    </div>
</body>

</html>
