<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ex.css">
</head>
<body>
    <div class="a1" align="center">
        <h1>Survery Form</h1>
        <p><i>Thank You for taking time to help us improve</i></p>
    </div>
    
    <div class="a2">
        <form action="">

            <label for="name">Name</label>
            <input type="text" name="name" id="name">
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
            <label for="age">Age</label>
            <input type="text" name="age" id="age">
            
            <label for="role">Your Role?</label>
            <select name="role" id="role">
                <option value="">Select Role</option>
                <option value="">Student</option>
                <option value="">Job</option>
                <option value="">Prefer not to say</option>
                <option value="">Other</option>
            </select>

            <label for="">Recommend to a friend</label>

            <div class="a3">
                <label>
                    <input type="radio" name="a" id="definitely">
                    Definitely
                </label>    
                <label>
                    <input type="radio" name="a" id="maybe">
                    Maybe
                </label>
                <label>
                    <input type="radio" name="b" id="">
                    Not sure
                </label>
                <label>
                    <input type="radio" name="b" id="">
                    I won't
                </label>
            </div>

            <label for="">What do you like to Improve</label>

            <div class="a4">
                <label>
                    <input type="checkbox" name="" id="">
                    Front-end Projects
                </label>
                <label>
                    <input type="checkbox" name="" id="">
                    Back-end Projects
                </label>
                <label>
                    <input type="checkbox" name="" id="">
                    Challenges
                </label>
                <label>
                    <input type="checkbox" name="" id="">
                    Videos
                </label>
                <label>
                    <input type="checkbox" name="" id="">
                    Additional Courses
                </label>
            </div>

            <label for="">Any comments ?</label>
            <textarea name="" id="" placeholder="Enter your commment here....."></textarea>

            <button>Submit</button>
        </form>
    </div>      
</body>
</html>
