<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Using Tailwind CSS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @theme {
            --color-ammaar: #f8f4f0;       /* Cream */
            --color-ammaar-1: #34a0a4;     /* Teal / Turquoise */
            --color-ammaar-2: #1a1a1a;     /* Almost Black */
            --color-ammaar-3: #555555;     /* Dark Gray */
            --color-ammaar-4: #0f7c80;     /* Dark Teal */  
            --color-ammaar-5: #f4a340;     /* Amber / Orange */
            --spacing-ammaar: 50px;        /* Spacing */
            --radius-ammaar: 30px;         /* Border Radius */
        }

    </style>
</head>

<body class="bg-ammaar p-4 text-ammaar-2">

    <div class="rounded-ammaar bg-[url(https://websitedemos.net/real-estate-company-04/wp-content/uploads/sites/1484/2023/07/hero-bg.jpg)] bg-cover bg-center w-full">

        <div class="bg-black/60 text-white min-h-[820px] rounded-ammaar p-6 flex flex-col justify-between">

            <div class="">
                <h1 class="">Real
                    <span class="font-bold">Estate</span>
                </h1>


            </div>
        </div>

    </div>

</body>

</html>
