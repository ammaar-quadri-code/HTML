
<!DOCTYPE html>
<html>
<head>
    <title>Password Generator</title>
</head>
<body>

    <h2>Password Generator</h2>

    <script>
        let len = Number(prompt("Enter password length:"));

        let special = prompt("special characters? (y/n)");
        let capital = prompt("capital letters? (y/n)");
        let small = prompt("small letters? (y/n)");
        let numbers = prompt("numbers? (y/n)");

        let characters = "";

        if (special.toLowerCase() === "y") {
            characters += "!@#$%^&*";
        }

        if (capital.toLowerCase() === "y") {
            characters += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        }

        if (small.toLowerCase() === "y") {
            characters += "abcdefghijklmnopqrstuvwxyz";
        }

        if (numbers.toLowerCase() === "y") {
            characters += "0123456789";
        }

        let password = "";

        if (characters.length === 0 || len <= 0) {
            alert("enter a valid option.");
        } 
        
        else 
        {
            for (let i = 0; i < len; i++) 
            {
                let randomIndex = Math.floor(Math.random() * characters.length);
                password += characters[randomIndex]; //gives random character from the characters string
            }

            alert("Your Password: " + password);
        }
    </script>

</body>
</html>
