<body>
    
    <script>
        // OTP Generator
        function generateOTP() {
            let num = '0123456789'
            
            let otp = '';
            for (let i = 0; i < 6; i++) {
                
                otp += num[Math.floor(Math.random() * 10)];
            }
            return otp;
            
        }

        console.log(generateOTP())
    </script>
