    <script>

        //Pure & Impure Functions

        const add = (a, b) => a + b; //pure function because it is not dependent on any external variable
        let discount = 90

        discount = 80

        function discountedRate(total, discount) { //not dependent on any external variable
            return total - (total * discount / 100);
        }

        function discountedRate2(total) { // impure function because it is dependent on external variable
            discount = 50
            return total - discount * total / 100
        }

        console.log(discountedRate(500, 10));
        console.log(discountedRate2(500));

        discount = 20

        console.log(discountedRate(500, 10));
        console.log(discountedRate2(500));

        add(2, 5)


        // Higher order -> Function which takes another function as an argument or returns a function as a result is called higher order function

        function areaOfSquare(s) {
            return "Area of Square is: " + s * s
        }

        function parameterOfSquare(s) {
            return "Parameter of Square is: " + 4 * s
        }

            return "Diagonal of Square is: " + Math.sqrt(2) * s
