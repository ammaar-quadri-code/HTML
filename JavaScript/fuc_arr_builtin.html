        function productDetails(productArray) {

            let sum = 0
            let priceTotal = 0
            let maxPrice = 0
            let expProduct = ''
            let stock = 0
            let mostProd = ''
            for (const element of productArray) {
                sum = sum + element.price * element.stock
                priceTotal = priceTotal + element.price
                if (element.price > maxPrice) {
                    maxPrice = element.price
                    expProduct = element.name
                }
                if (element.stock > stock) {
                    stock = element.stock
                    mostProd = element.name
                }
            }
            console.log(`total inventory value: ${sum}`);
            console.log(`Most Expensive Product: ${expProduct} priced at ${maxPrice}`);
            console.log(`total inventory value: ${priceTotal / products1.length}`);
            console.log(`Most stocked Product: ${mostProd} stocked at ${stock}`);
